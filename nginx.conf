server {
    listen 80;
    listen [::]:80;
    server_name your_domain_here.com www.your_domain_here.com;

    # Redirect all HTTP traffic to HTTPS securely
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your_domain_here.com www.your_domain_here.com;

    # SSL Certificates (managed automatically by Let's Encrypt / Certbot on VPS)
    ssl_certificate /etc/letsencrypt/live/your_domain_here.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain_here.com/privkey.pem;

    # Strong SSL Security configurations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # React Single Page Application (SPA) Static Files
    root /var/www/immersio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        
        # Caching static assets optimized
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Disable caching for index.html to ensure users always get the latest update
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy API Requests to .NET 9.0 Web API Docker Container
    location /api/ {
        proxy_pass http://127.0.0.1:5249/api/;
        proxy_http_version 1.1;
        
        # Connection properties
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;

        # Forward headers for correct client IP and HTTP protocol resolution
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
