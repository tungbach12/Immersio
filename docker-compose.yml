services:
  postgres-db:
    image: postgres:16-alpine
    container_name: immersio-db
    restart: always
    environment:
      POSTGRES_DB: ImmersioDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ImmersioDb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - immersio-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  immersio-api:
    # Java 21 Spring Modulith backend (see backend/). The legacy .NET image is
    # still published as immersio-be:latest — rollback = revert this image line.
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-tungbach12}/immersio-be-java:latest
    container_name: immersio-api
    restart: always
    environment:
      # Spring datasource (application.yml binds these; .NET-style vars in .env
      # are mapped by backend/src/main/resources/application.yml as fallbacks)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/ImmersioDb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-your_secure_password_here}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55 -Djava.security.egd=file:/dev/urandom
    env_file:
      - .env
      - path: secrets.env
        required: false
    ports:
      - "127.0.0.1:5249:5249"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - immersio-network
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 320M

volumes:
  pgdata:

networks:
  immersio-network:
    driver: bridge
