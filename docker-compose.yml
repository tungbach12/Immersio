services:
  postgres-db:
    image: postgres:16-alpine
    container_name: immersio-db
    restart: always
    environment:
      POSTGRES_DB: ImmersioDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password_here}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ImmersioDb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - immersio-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  immersio-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-tungbach12}/immersio-be:latest
    container_name: immersio-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=ImmersioDb;Username=postgres;Password=${DB_PASSWORD:-your_secure_password_here}
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_GCHeapHardLimit=300000000
      - DOTNET_GCConserveMemory=9
      - DOTNET_EnableDiagnostics=0
      - ASPNETCORE_threadPool_minThreads=8
      - ASPNETCORE_threadPool_maxThreads=50
    env_file:
      - .env
      - path: secrets.env
        required: false
    ports:
      - "127.0.0.1:5249:5249"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - immersio-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pgdata:

networks:
  immersio-network:
    driver: bridge
