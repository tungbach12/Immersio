name: Immersio Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'immersioFe/package-lock.json'

      - name: Install Dependencies
        working-directory: ./immersioFe
        run: npm ci

      - name: Build Static Assets
        working-directory: ./immersioFe
        run: npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: immersioFe/dist
          retention-days: 1

  build-backend:
    name: Build & Push C# Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/immersio-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS2
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Archive Frontend
        run: tar -czf dist.tar.gz -C dist .

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          tags: tag:ci
          ping: 100.120.66.114

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.120.66.114 >> ~/.ssh/known_hosts

      - name: Deploy Frontend
        run: |
          scp -i ~/.ssh/deploy_key -P 2222 -o StrictHostKeyChecking=no dist.tar.gz ubuntu@100.120.66.114:/tmp/
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            sudo mkdir -p /var/www/immersio
            sudo rm -rf /var/www/immersio
            sudo mkdir /var/www/immersio
            sudo tar -xzf /tmp/dist.tar.gz -C /var/www/immersio
            sudo chown -R ubuntu:ubuntu /var/www/immersio
            sudo chmod -R 755 /var/www/immersio
          '

      - name: Prepare Docker Compose Directory
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            mkdir -p /opt/immersio
          '
          scp -i ~/.ssh/deploy_key -P 2222 -o StrictHostKeyChecking=no docker-compose.yml ubuntu@100.120.66.114:/opt/immersio/

      - name: Create Environment File
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          JWT_KEY="${{ secrets.JWT_KEY }}"
          if [ -z "$JWT_KEY" ]; then
            JWT_KEY="ImmersioSuperSecretJwtKey2026_WithUltraStrongEntropy_SecureBase64KeyString!"
          fi
          # Write .env line by line to avoid YAML parsing issues
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > /tmp/immersio.env
          echo "Jwt__Key=$JWT_KEY" >> /tmp/immersio.env
          echo "Jwt__Issuer=ImmersioApi" >> /tmp/immersio.env
          echo "Jwt__Audience=ImmersioUsers" >> /tmp/immersio.env
          echo "Jwt__AccessTokenExpiryMinutes=15" >> /tmp/immersio.env
          echo "Jwt__RefreshTokenExpiryDays=7" >> /tmp/immersio.env
          echo "Google__ClientId=292647291155-7bfaa0cioukmqmah4g5lhg9qqcd1mu26.apps.googleusercontent.com" >> /tmp/immersio.env
          echo "Cloudinary__CloudName=drv8ya4wy" >> /tmp/immersio.env
          echo "Cloudinary__ApiKey=848873137638397" >> /tmp/immersio.env
          echo "Cloudinary__ApiSecret=_bUe78YdhzgXCgBoeaKulfas3JY" >> /tmp/immersio.env
          echo "Email__Smtp__Host=smtp.gmail.com" >> /tmp/immersio.env
          echo "Email__Smtp__Port=587" >> /tmp/immersio.env
          echo "Email__Smtp__Username=ngovanminhtri05@gmail.com" >> /tmp/immersio.env
          echo "Email__Smtp__Password=gzqvjzqqwtlypaiv" >> /tmp/immersio.env
          echo "Email__Smtp__FromEmail=ngovanminhtri05@gmail.com" >> /tmp/immersio.env
          echo "Email__Smtp__FromName=IMMERSIO" >> /tmp/immersio.env
          echo "PayOS__ClientId=14d11f61-16c9-4747-84d8-bb61408a9947" >> /tmp/immersio.env
          echo "PayOS__ApiKey=c8880866-5f72-4832-bbfc-a2364556fb6a" >> /tmp/immersio.env
          echo "PayOS__ChecksumKey=bf5d332adc1721f42a5101ee1caf28c3d49e4cda4c324d9ecb72420b70f3580f" >> /tmp/immersio.env
          echo "PayOS__ReturnUrl=https://immersio.me/payment/payos-return" >> /tmp/immersio.env
          echo "PayOS__CancelUrl=https://immersio.me/payment/payos-return" >> /tmp/immersio.env
          echo "Azure__Speech__ApiKey=${{ secrets.AZURE_SPEECH_API_KEY }}" >> /tmp/immersio.env
          echo "Azure__Speech__Region=southeastasia" >> /tmp/immersio.env
          echo "Azure__Speech__Endpoint=https://southeastasia.api.cognitive.microsoft.com/" >> /tmp/immersio.env
          echo "GITHUB_REPOSITORY_OWNER=$OWNER_LOWER" >> /tmp/immersio.env
          scp -i ~/.ssh/deploy_key -P 2222 -o StrictHostKeyChecking=no /tmp/immersio.env ubuntu@100.120.66.114:/opt/immersio/.env

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 "docker login ghcr.io -u \"${{ github.actor }}\" --password-stdin"

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/deploy_key -p 2222 -o StrictHostKeyChecking=no ubuntu@100.120.66.114 '
            cd /opt/immersio
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          '
