name: Immersio Production CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'immersioFe/package-lock.json'

      - name: Install Dependencies
        working-directory: ./immersioFe
        run: npm ci

      - name: Build Static Assets
        working-directory: ./immersioFe
        run: npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: immersioFe/dist
          retention-days: 1

  build-backend:
    name: Build & Push C# Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/immersio-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Linux VPS
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - name: Compress Frontend Assets (Tarball Optimization)
        run: tar -czf dist.tar.gz -C dist .

      - name: Copy Deployment Packages to VPS (Single Stream SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist.tar.gz,docker-compose.yml"
          target: "/home/azureuser/immersio"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_OWNER,DB_PASSWORD
          script: |
            # Create target deployment folder if missing
            mkdir -p /home/azureuser/immersio
            cd /home/azureuser/immersio

            # Extract frontend assets to Nginx folder and align permissions
            sudo rm -rf /var/www/immersio/*
            sudo tar -xzf dist.tar.gz -C /var/www/immersio
            sudo chown -R azureuser:azureuser /var/www/immersio
            sudo chmod -R 755 /var/www/immersio
            rm -f dist.tar.gz

            # Set owner lowercase
            OWNER_LOWER=$(echo "$GITHUB_OWNER" | tr '[:upper:]' '[:lower:]')

            # Log into GHCR inside the VPS
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Set environment variables for docker compose run via .env file
            echo "DB_PASSWORD=$DB_PASSWORD" > .env
            echo "GITHUB_REPOSITORY_OWNER=$OWNER_LOWER" >> .env

            # Pull the latest backend image and restart the docker-compose services
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old dangling Docker images to free up VPS disk space
            docker image prune -f
