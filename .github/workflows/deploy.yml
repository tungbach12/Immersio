name: Immersio Production CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'immersioFe/package-lock.json'

      - name: Install Dependencies
        working-directory: ./immersioFe
        run: npm ci

      - name: Build Static Assets
        working-directory: ./immersioFe
        run: npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: immersioFe/dist
          retention-days: 1

  build-backend:
    name: Build & Push C# Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/immersio-be:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS2
    runs-on: self-hosted
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Archive Frontend
        run: tar -czf dist.tar.gz -C dist .

      - name: Deploy Frontend
        run: |
          sudo mkdir -p /var/www/immersio
          sudo rm -rf /var/www/immersio
          sudo mkdir /var/www/immersio
          sudo tar -xzf dist.tar.gz -C /var/www/immersio
          sudo chown -R ubuntu:ubuntu /var/www/immersio
          sudo chmod -R 755 /var/www/immersio

      - name: Prepare Docker Compose Directory
        run: |
          mkdir -p /opt/immersio
          cp docker-compose.yml /opt/immersio/

      - name: Create Environment File
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > /opt/immersio/.env
          echo "GITHUB_REPOSITORY_OWNER=$OWNER_LOWER" >> /opt/immersio/.env

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy Backend
        working-directory: /opt/immersio
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
